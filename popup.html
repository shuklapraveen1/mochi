<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="box">
    <header>
      <img src="assets/icon48.png" alt="" width="24" height="24">
      <h1>Mochi</h1>
    </header>

    <button class="row" id="rowHidden" role="switch" aria-checked="true">
      <span class="txt"><b>Mochi</b><small>Show the characters on chat pages</small></span>
      <span class="sw"><i class="knob"></i></span>
    </button>

    <div class="sep"></div>

    <button class="row" id="rowEnabled" role="switch" aria-checked="true">
      <span class="txt"><b>Emotions &amp; actions</b><small>Hover menu and Enter reactions</small></span>
      <span class="sw"><i class="knob"></i></span>
    </button>

    <p class="hint">Hover the characters for emotions &amp; actions.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
